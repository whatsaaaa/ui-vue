name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - name: Fail if lint auto-fixed anything
        run: git diff --exit-code
      # builds the Vue playground first, whose type declarations Nuxt UI's Vite plugin writes
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build

  browser:
    runs-on: ubuntu-latest
    # The version of the image is the version of @playwright/test.
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # builds both playgrounds, then tests what they built
      - run: pnpm test:browser
      - name: Keep the report when a test fails
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
