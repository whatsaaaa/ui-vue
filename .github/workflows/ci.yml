name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks are named `ci / check` and `ci / browser`, which the main ruleset requires
  ci:
    uses: whatsaaaa/template/.github/workflows/node-ci.yml@v1
    with:
      # The version of @playwright/test in package.json, which is the tag of the Playwright image
      # the browser job runs in.
      playwright-version: 1.65.0
