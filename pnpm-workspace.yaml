packages:
  - packages/*
  - playgrounds/*

# pnpm installs no package younger than a day (minimumReleaseAge). Our own packages are let in
# as soon as they are published, so a project can take a release of them right away.
minimumReleaseAgeExclude:
  - '@whatsaaaa/*'

# A dependency's install script runs only when allowBuilds lists it: true to run it, false to
# skip it, each with a comment that says why.
allowBuilds:
  # esbuild's postinstall only checks the native binary that pnpm already installs through its
  # optional platform package
  esbuild: false
  # vue-demi's only picks the build for Vue 2 or 3, where the one it ships with is already Vue 3's
  vue-demi: false
